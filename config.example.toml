# Copy to ~/.config/pr-digest/config.toml and change what differs for you.
# Everything not listed here has a working default in settings.py.

me = "your-github-login"

# The folder you start Claude in. Reviews, follow-ups and "Open in Claude" sessions
# start here, so they pick up its CLAUDE.md and its .claude/agents/. Your repo clones
# are expected at <workspace>/<repo>.
workspace = "~/work"
# repos_root = "~/code"          # only if your clones live somewhere else

[review]
# Your review agent, by name. Claude finds it in <workspace>/.claude/agents/ or
# ~/.claude/agents/. Its model and effort come from the agent file.
# "" turns reviews off: you still get the menu and notifications.
reviewer_agent = "pr-reviewer"
# A second agent that checks the reviewer's findings before you see them. "" skips it.
verifier_agent = "pr-review-verifier"

[watcher]
# Re-approve for you after the author pushes, but only once they've done everything
# your comments asked and every blocking comment or change request on the PR, from
# any reviewer, has been answered.
auto_reapprove = false

[notify]
sounds = true                    # false: every notification is silent
# done_sound = "/System/Library/Sounds/Purr.aiff"   # the quiet "✅ Fixed for you"

[autofix]
# Fix a reviewer's nit or suggestion on your own PR when Claude rates it mechanical,
# agrees with it and is at least min_confidence sure; then validate, commit, merge the
# base branch if behind, push, reply, resolve the thread and re-request the reviewer.
# It pushes and posts as you.
enabled = false                  # nothing runs until you turn it on
dry_run = true                   # when enabled: do everything up to the commit, then stop
categories = ["nit", "suggestion"]
min_confidence = 0.9
max_lines = 40                   # lines added plus removed per fix
prompt = ""                      # edit prompt template path; "" uses the bundled one
model = ""                       # "" uses [models] followup
# assess_timeout = 600
# edit_timeout = 900
# validate_timeout = 1800

# Each repo's validation is worked out from its files: an Elm repo (elm.json) runs
# these agents in order; an sbt build runs `sbt -batch compile Test/compile ...` with
# the tasks its files call for; any other repo escalates.
# elm_agents = ["elm-validation", "elm-conventions-review"]

[autofix.validate]
# Overrides only: repo = "command run in the fix's worktree".
# processservice = "sbt -batch compile Test/compile test"

[triage]
# Your pod's GitHub logins. Their review requests are red from the start and stay red
# until you've reviewed, even once others approve.
pod = []

[jira]
# PRs for sub-tasks of one Jira ticket show as one group in the menu, titled with the
# parent ticket. "" turns the lookup off (only PRs sharing a ticket key group).
cli = "acli"
cache_days = 7
# A story row links to the ticket: browse_url + key. "" leaves it unlinked.
browse_url = ""
